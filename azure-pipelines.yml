# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformWorkingDir: '$(Build.SourcesDirectory)/env/dev'

stages:
  - stage: terraform
    displayName: Terraform
    jobs:
      - job: init
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

# -----------------------------
#  Terraform Init (DEV backend)
# -----------------------------
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDir)'
              backendServiceArm: 'azuredevops-serviceconnection'
              backendAzureRmStorageAccountName: 'storageacc316'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.tfstate'

# -----------------------------
#  Terraform Validate
# -----------------------------
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDir)'

# -----------------------------
#  Terraform Plan (DEV)
# -----------------------------
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDir)'
              environmentServiceNameAzureRM: 'azuredevops-serviceconnection'

# -----------------------------
#  Terraform Apply (DEV)
# -----------------------------
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDir)'
              environmentServiceNameAzureRM: 'azuredevops-serviceconnection'