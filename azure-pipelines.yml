# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  TF_WORKING_DIR: '$(System.DefaultWorkingDirectory)/terraform'
  SERVICE_CONNECTION: 'azure-connection'

stages:
  - stage: terrform_init
    displayName: terraform init
    jobs:
      - job: init
        steps:
         - task: TerraformInstaller@1
           inputs:
             terraformVersion: 'latest'
         - task: TerraformTask@5
           inputs:
             provider: 'azurerm'
             command: 'init'
             backendServiceArm: 'azuredevops-serviceconnection'
             backendAzureRmStorageAccountName: 'storageacc316'
             backendAzureRmContainerName: 'tfstate'
             backendAzureRmKey: 'dev.tfstate'
  - stage: terrform_plan
    displayName: terraform plan
    jobs:     
      - job: plan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'azuredevops-serviceconnection'